name: Deploy to AWS Lambda@Edge

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Use OIDC for secure AWS authentication (recommended)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Option 1: Using OIDC (recommended - more secure, no long-lived credentials)
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

          # Option 2: Using access keys (simpler setup, less secure)
          # Uncomment these and comment out role-to-assume if using access keys
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy with SST
        run: npx sst deploy --stage production
        env:
          # Add any environment variables your app needs
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Output deployment URL
        run: |
          echo "Deployment complete!"
          echo "Check your AWS CloudFormation stack for the site URL"

      # Optional: Create a GitHub deployment
      - name: Create GitHub deployment
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
            });
